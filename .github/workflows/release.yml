name: build-and-sign

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.1.0 (tag v<version> is created)"
        required: true
        default: "1.1.0"

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the release tag (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f $env:TAG
          git push -f origin $env:TAG

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Refresh assets
        run: |
          python make_assets.py
          python make_installer_art.py

      - name: Fetch bundled tools (yt-dlp, deno, ffmpeg)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item bundled/ytdlp, bundled/runtime, bundled/ffmpeg/bin -ItemType Directory -Force | Out-Null
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile bundled/ytdlp/yt-dlp.exe
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath bundled/runtime -Force
          Remove-Item deno.zip
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_unpacked -Force
          Remove-Item ffmpeg.zip
          $ffmpeg = Get-ChildItem ffmpeg_unpacked -Recurse -Filter ffmpeg.exe | Select-Object -First 1 -ExpandProperty FullName
          $ffprobe = Get-ChildItem ffmpeg_unpacked -Recurse -Filter ffprobe.exe | Select-Object -First 1 -ExpandProperty FullName
          Copy-Item $ffmpeg, $ffprobe bundled/ffmpeg/bin/

      - name: Package the app
        run: pyinstaller --noconfirm --clean ReelHaul.spec

      - name: Stage bundled tools into the build (installer layout)
        shell: pwsh
        run: |
          Copy-Item bundled/ytdlp   dist/ReelHaul/ytdlp   -Recurse -Force
          Copy-Item bundled/runtime dist/ReelHaul/runtime -Recurse -Force
          Copy-Item bundled/ffmpeg  dist/ReelHaul/ffmpeg  -Recurse -Force

      - name: Self-test the build
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ReelHaul\ReelHaul.exe" -ArgumentList "--selftest" -PassThru -WindowStyle Hidden
          $p.WaitForExit(180000) | Out-Null
          Get-Content "$env:APPDATA\ReelHaul\selftest.json" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "selftest failed" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Zip signing artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "dist\ReelHaul\ReelHaul.exe" -DestinationPath signing-artifact.zip -Force
          $setup = Get-ChildItem release/ReelHaul-Setup-*.exe | Select-Object -First 1
          # add the setup to the artifact zip without dropping the app exe
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::Open("$PWD\signing-artifact.zip", "Update")
          [IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $setup.FullName, $setup.Name) | Out-Null
          $zip.Dispose()
          Get-ChildItem signing-artifact.zip | Select-Object Name, Length

      - name: Upload unsigned artifact
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: signing-artifact
          path: signing-artifact.zip

      - name: Submit signing request to SignPath
        id: sign
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'reelhaul' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "1800"
          output-artifact-directory: signed

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem signed/ReelHaul-Setup-*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) {
            Write-Host "::warning::No signed artifact (SignPath not configured?) - attaching unsigned build"
            $setup = Get-ChildItem release/ReelHaul-Setup-*.exe | Select-Object -First 1
          }
          if (Test-Path signed) { Copy-Item signed/* release/ -Force }
          gh release create "$env:TAG" $setup.FullName --generate-notes --title "ReelHaul $env:TAG"
